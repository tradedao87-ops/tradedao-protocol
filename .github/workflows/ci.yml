name: CI & Typecheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sdk-check:
    name: SDK Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sdk/package.json

      - name: Install SDK Dependencies
        working-directory: sdk
        run: npm install

      - name: Typecheck SDK
        working-directory: sdk
        run: npm run build
